<!DOCTYPE>
<html>
  <head>
    <style>
      .flex-container {
        display: flex;
        flex-wrap: nowrap;
        background-color: DodgerBlue;
      }
      .flex-container > div {
        background-color: #f1f1f1;
        width: 100px;
        margin: 10px;
        text-align: center;
        line-height: 75px;
        font-size: 30px;
      }
      @media (max-width: 600px) {
        .flex-container {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
    <title>HTML Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header><h1>My Favorite Music Page</h1></header>
    <main>
      <section>
        <h2>Songs I like from Bon Jovi:</h2>
    <p>This is a list of songs I like from Bon Jovi</p>
    <ol>
      <li>Livin' on a Prayer</li>
      <li>Wanted Dead or Alive</li>
      <li>You Give Love a Bad Name</li>
      <li>Runaway</li>
    </ol>
      </section>
    </main>
    <footer>
      <h3>Cover Photo</h3>
    <img alt="A symbol of Bon Jovi" src='/img/BonJovi.jpg" alt="The cover photo for Bon Jovi"/>
    </footer>
  </body>
</html>
